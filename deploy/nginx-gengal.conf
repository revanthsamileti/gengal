# GenGal backend reverse proxy.
#
# Install to /etc/nginx/sites-available/gengal and symlink into sites-enabled.
# Replace api.example.com with your hostname, then run:
#     sudo certbot --nginx -d api.example.com
# Certbot rewrites this file in place to add the TLS listener and a 301 from
# port 80, so start with plain HTTP here rather than referencing certificate
# paths that do not exist yet -- nginx refuses to start on a missing cert, which
# would leave you locked out before certbot ever runs.

upstream gengal_backend {
    server 127.0.0.1:5055;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Razorpay posts webhooks with a signature over the raw body, and the app
    # verifies it. Anything that rewrites the body breaks that check, so no
    # gzip on requests and no buffering games on this path.
    client_max_body_size 12M;

    # The call path is chatty but small: RTC token mints and 15-second billing
    # ticks. 60s is far longer than any of them need and still short enough
    # that a wedged upstream surfaces rather than piling up connections.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://gengal_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app cannot tell HTTPS from HTTP behind the proxy,
        # so any absolute URL it builds (PUBLIC_BASE_URL fallbacks, payment
        # return URLs) comes out as http:// and the payment flow breaks.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Cheap liveness probe that does not touch Firestore. The app has no
    # dedicated health route, so this is just the 404 handler answering --
    # a 404 here still proves the process is up and nginx can reach it.
    location = /_up {
        proxy_pass http://gengal_backend/;
        access_log off;
    }
}
